version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 10 1 2,4,6,8,10,12 *"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 2
    cooldown:
      default-days: 7
    groups:
      github-actions-non-major:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"

  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "cron"
      cronjob: "0 10 1 2,4,6,8,10,12 *"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      cargo-patch:
        patterns:
          - "*"
        update-types:
          - "patch"
      cargo-minor:
        patterns:
          - "*"
        update-types:
          - "minor"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # Zed git crates must move together with gpui-component's rev (wrap_line
      # API, see #500); the lockfile keeps them on the rev it builds against.
      - dependency-name: "gpui"
      - dependency-name: "gpui_platform"

  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "cron"
      cronjob: "0 10 1 2,4,6,8,10,12 *"
      timezone: "America/Los_Angeles"
    open-pull-requests-limit: 3
    cooldown:
      default-days: 7
    groups:
      web-production-non-major:
        dependency-type: "production"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      web-development-non-major:
        dependency-type: "development"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      - dependency-name: "*"
        update-types:
          - "version-update:semver-major"
      # 0.15 drops useThread, still imported by @assistant-ui/react-ui (see #496).
      - dependency-name: "@assistant-ui/react"
        versions: [">=0.15.0"]
      # react-markdown 0.14.8+ peers on @assistant-ui/react ^0.15 (see #508).
      - dependency-name: "@assistant-ui/react-markdown"
        versions: [">=0.14.8"]

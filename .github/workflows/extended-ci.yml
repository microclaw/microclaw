name: Extended CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  rust-windows:
    name: Rust (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov -p microclaw --all-features --lcov --output-path target/llvm-cov.lcov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: target/llvm-cov.lcov
          if-no-files-found: error

  nix-build:
    name: Nix Build (flake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - run: nix build .#microclaw

  work-desktop:
    name: MicroClaw Work (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: microclaw-work-macos
      - run: cargo check -p microclaw-work --locked
      - run: cargo test -p microclaw-work-app --locked
      - run: cargo test -p microclaw-work-headless --locked
      - run: cargo clippy -p microclaw-work-app --all-targets --locked -- -D warnings
      - run: cargo clippy -p microclaw-work --all-targets --no-deps --locked -- -D warnings
      - run: cargo clippy -p microclaw-work-headless --all-targets --no-deps --locked -- -D warnings
      - name: Reclaim disk before release bundle
        run: cargo clean
      - name: Build release macOS DMG preview
        run: scripts/build_work_macos_dmg.sh work-release
      - name: Launch-smoke macOS app bundle
        run: scripts/smoke_work_macos_app.sh work-release
      - name: Upload macOS preview
        uses: actions/upload-artifact@v4
        with:
          name: microclaw-work-macos-dmg
          path: target/microclaw-work-installer/work-release/*.dmg
          if-no-files-found: error
          retention-days: 14

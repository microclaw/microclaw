name: Extended CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  rust-windows:
    name: Rust (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov -p microclaw --all-features --lcov --output-path target/llvm-cov.lcov
      - uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: target/llvm-cov.lcov
          if-no-files-found: error

  nix-build:
    name: Nix Build (flake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
        with:
          use-gha-cache: enabled
          use-flakehub: disabled
      - run: nix build .#microclaw

  work-desktop:
    name: MicroClaw Work (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: microclaw-work-macos
      - run: cargo check -p microclaw-work --locked
      - run: cargo test -p microclaw-work-app --locked
      - run: cargo test -p microclaw-work-headless --locked
      - run: cargo clippy -p microclaw-work-app --all-targets --locked -- -D warnings
      - run: cargo clippy -p microclaw-work --all-targets --no-deps --locked -- -D warnings
      - run: cargo clippy -p microclaw-work-headless --all-targets --no-deps --locked -- -D warnings

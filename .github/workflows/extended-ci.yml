name: Extended CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

jobs:
  rust-windows:
    name: Rust (windows-latest)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - run: cargo install cargo-llvm-cov --locked
      - run: cargo llvm-cov --workspace --all-features --lcov --output-path target/llvm-cov.lcov
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: target/llvm-cov.lcov
          if-no-files-found: error

  nix-build:
    name: Nix Build (flake)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v19
      - uses: DeterminateSystems/magic-nix-cache-action@v13
      - run: nix build .#microclaw

  work-desktop:
    name: MicroClaw Work (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux GPUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            cmake \
            gcc \
            g++ \
            libasound2-dev \
            libfontconfig-dev \
            libgit2-dev \
            libglib2.0-dev \
            libssl-dev \
            libstdc++-14-dev \
            libva-dev \
            libvulkan1 \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libzstd-dev \
            pipewire \
            xdg-desktop-portal
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: microclaw-work-${{ matrix.os }}
      - run: cargo check -p microclaw-work --locked
      - run: cargo test -p microclaw-work-app --locked
      - run: cargo test -p microclaw-work-headless --locked
      - run: cargo clippy -p microclaw-work-app --all-targets --locked -- -D warnings
      - run: cargo clippy -p microclaw-work --all-targets --no-deps --locked -- -D warnings
      - run: cargo clippy -p microclaw-work-headless --all-targets --no-deps --locked -- -D warnings
      - name: Build release desktop binary
        if: runner.os != 'macOS'
        run: cargo build -p microclaw-work --release --locked
      - name: Build release macOS DMG preview
        if: runner.os == 'macOS'
        run: scripts/build_work_macos_dmg.sh release
      - name: Launch-smoke macOS app bundle
        if: runner.os == 'macOS'
        run: scripts/smoke_work_macos_app.sh release
      - name: Package Linux preview
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p target/microclaw-work-preview
          cp target/release/microclaw-work target/microclaw-work-preview/
          cp LICENSE apps/microclaw-work/README.md target/microclaw-work-preview/
          tar -czf microclaw-work-linux-x86_64.tar.gz -C target microclaw-work-preview
      - name: Package Windows preview
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path target/microclaw-work-preview | Out-Null
          Copy-Item target/release/microclaw-work.exe target/microclaw-work-preview/
          Copy-Item LICENSE target/microclaw-work-preview/
          Copy-Item apps/microclaw-work/README.md target/microclaw-work-preview/
          Compress-Archive -Path target/microclaw-work-preview/* -DestinationPath microclaw-work-windows-x86_64.zip -Force
      - name: Upload Linux preview
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: microclaw-work-linux-x86_64
          path: microclaw-work-linux-x86_64.tar.gz
          if-no-files-found: error
          retention-days: 14
      - name: Upload macOS preview
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: microclaw-work-macos-dmg
          path: target/microclaw-work-installer/release/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Upload Windows preview
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: microclaw-work-windows-x86_64
          path: microclaw-work-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14

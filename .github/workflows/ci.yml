name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web And Docs Build (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Both supported LTS majors. Pinning every job to a single Node major
        # previously hid an engines pin that broke `cargo build` (and the snap
        # build) on the older LTS while CI stayed green.
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            web/package-lock.json
            site/package-lock.json
      - run: node scripts/generate_docs_artifacts.mjs --check
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      - run: npm --prefix site ci
      - run: npm --prefix site run build

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          tags: microclaw:test
          cache-from: type=gha,scope=ci-docker-build
          cache-to: type=gha,mode=max,scope=ci-docker-build

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit,cargo-deny
      # RUSTSEC-2026-0194/0195: quick-xml DoS advisories, transitive via the
      # typst 0.15 render stack (citationberg/hayagriva, plist/syntect);
      # fixed only in quick-xml >=0.41 which the parents haven't adopted.
      # See the matching entries (with rationale) in deny.toml.
      - run: cargo audit --ignore RUSTSEC-2026-0049 --ignore RUSTSEC-2026-0098 --ignore RUSTSEC-2026-0099 --ignore RUSTSEC-2026-0194 --ignore RUSTSEC-2026-0195
      - run: cargo deny check advisories bans licenses

  rust-ubuntu:
    name: Rust (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci/check_version_alignment.sh
      - run: scripts/ci/test_release_assets.sh
      - run: scripts/ci/check_runtime_boundaries.sh
      - run: scripts/ci/check_sdk_consumers.sh
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      - name: Trajectory eval gate
        run: cargo run --quiet -- eval docs/test/eval-fixtures

  rust-macos:
    name: Rust (macos-latest)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  stability-smoke:
    name: Stability Smoke
    runs-on: ubuntu-latest
    needs: [rust-ubuntu]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: scripts/ci/stability_smoke.sh
        env:
          RELIABILITY_SCORECARD_DIR: target/reliability-scorecard/latest
      - name: Upload reliability scorecard
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: reliability-scorecard
          path: target/reliability-scorecard/latest
          if-no-files-found: ignore

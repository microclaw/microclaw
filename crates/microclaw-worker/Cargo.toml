[package]
name = "microclaw-worker"
version = "0.1.0"
edition = "2021"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Authenticated remote Worker host and transport for MicroClaw"
keywords = ["ai", "agent", "websocket", "microclaw"]
categories = ["network-programming", "asynchronous"]

[dependencies]
async-trait = "0.1"
futures-util = "0.3"
http = "1"
microclaw-core = { version = "0.1.0", path = "../microclaw-core" }
microclaw-runtime = { version = "0.1.0", path = "../microclaw-runtime" }
serde_json = "1"
tokio = { version = "1", features = ["net", "rt", "sync"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

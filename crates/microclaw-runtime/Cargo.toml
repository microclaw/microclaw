[package]
name = "microclaw-runtime"
version = "0.1.0"
publish = false
edition = "2021"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Embeddable run lifecycle and Worker contracts for MicroClaw"
keywords = ["ai", "agent", "runtime", "microclaw"]
categories = ["asynchronous"]

[features]
default = ["standard"]
minimal = []
standard = []
full = ["standard"]

[dependencies]
async-trait = "0.1"
microclaw-core = { version = "0.2.0", path = "../microclaw-core" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

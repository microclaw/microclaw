[package]
name = "microclaw-runtime"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["standard"]
minimal = []
standard = []
full = ["standard"]

[dependencies]
async-trait = "0.1"
microclaw-core = { version = "0.1.0", path = "../microclaw-core" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }

[package]
name = "microclaw-channels"
version = "0.1.0"
publish = false
edition = "2021"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Channel-neutral messaging contracts and adapters for MicroClaw"
keywords = ["ai", "agent", "chat", "microclaw"]
categories = ["api-bindings"]

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
microclaw-core = { version = "0.2.0", path = "../microclaw-core" }
microclaw-storage = { version = "0.1.0", path = "../microclaw-storage" }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["time"] }
uuid = { version = "1", features = ["v4"] }

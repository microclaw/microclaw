[package]
name = "microclaw-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["standard"]
minimal = ["microclaw-runtime/minimal"]
standard = ["microclaw-runtime/standard"]
full = ["microclaw-runtime/full", "dep:microclaw"]

[dependencies]
microclaw-core = { version = "0.1.0", path = "../microclaw-core" }
microclaw-runtime = { version = "0.1.0", path = "../microclaw-runtime" }
microclaw = { version = "0.5.5", path = "../..", default-features = false, optional = true }

[[example]]
name = "configured_skilled_agent"
required-features = ["full"]

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

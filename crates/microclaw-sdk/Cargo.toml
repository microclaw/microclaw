[package]
name = "microclaw-sdk"
version = "0.2.0"
edition = "2021"
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Official Rust SDK for embedding MicroClaw agents, Skills, and Workers"
documentation = "https://docs.rs/microclaw-sdk"
keywords = ["ai", "agent", "sdk", "llm", "microclaw"]
categories = ["api-bindings", "asynchronous"]

[features]
default = ["standard"]
minimal = []
standard = []
remote-worker = []
full = ["remote-worker"]

[dependencies]
microclaw-core = { version = "0.2.0", path = "../microclaw-core" }
microclaw-engine = { version = "0.2.0", path = "../microclaw-engine" }
serde_json = "1"
thiserror = "2"

[[example]]
name = "configured_skilled_agent"
required-features = ["full"]

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

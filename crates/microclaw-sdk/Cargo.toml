[package]
name = "microclaw-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"

[features]
default = ["standard"]
minimal = ["microclaw-runtime/minimal"]
standard = ["microclaw-runtime/standard"]
remote-worker = ["dep:microclaw-worker"]
full = ["microclaw-runtime/full", "dep:microclaw-engine", "remote-worker"]

[dependencies]
microclaw-core = { version = "0.1.0", path = "../microclaw-core" }
microclaw-runtime = { version = "0.1.0", path = "../microclaw-runtime" }
microclaw-engine = { version = "0.1.0", path = "../microclaw-engine", optional = true }
microclaw-worker = { version = "0.1.0", path = "../microclaw-worker", optional = true }
serde_json = "1"
thiserror = "2"

[[example]]
name = "configured_skilled_agent"
required-features = ["full"]

[dev-dependencies]
async-trait = "0.1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

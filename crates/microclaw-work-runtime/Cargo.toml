[package]
name = "microclaw-work-runtime"
version = "0.11.1"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
chrono = "0.4"
dirs = "6"
futures-util = "0.3"
microclaw-core = { version = "0.11.1", path = "../microclaw-core" }
microclaw-engine = { version = "0.11.1", path = "../microclaw-engine" }
microclaw-sdk = { version = "0.11.1", path = "../microclaw-sdk", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "process", "io-util"] }
toml = "0.8"
url = "2"

[dev-dependencies]
tempfile = "3"

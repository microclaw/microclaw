[package]
name = "microclaw-work-runtime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
microclaw = { path = "../.." }
microclaw-core = { version = "0.1.0", path = "../microclaw-core" }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[package]
name = "microclaw-work-headless"
version = "0.6.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
microclaw-sdk = { version = "0.6.0", path = "../../crates/microclaw-sdk", features = ["full"] }
microclaw-work-app = { version = "0.6.0", path = "../../crates/microclaw-work-app" }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tempfile = "3"

[package]
name = "microclaw-work"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
dirs = "6"
gpui = { version = "0.2.2", git = "https://github.com/zed-industries/zed" }
gpui_platform = { git = "https://github.com/zed-industries/zed", features = ["font-kit", "x11", "wayland", "runtime_shaders"] }
gpui-component = { git = "https://github.com/longbridge/gpui-component", rev = "d5821f270317754f2a311a0bb148ec32cbb0ced4" }
microclaw = { path = "../.." }
microclaw-core = { version = "0.1.0", path = "../../crates/microclaw-core" }
microclaw-work-app = { version = "0.1.0", path = "../../crates/microclaw-work-app" }
serde_json = "1"
smol = "2"
tokio = { version = "1", features = ["rt-multi-thread", "sync"] }
url = "2"

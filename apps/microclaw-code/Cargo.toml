[package]
name = "microclaw-code"
version = "0.26.0"
edition = "2024"
license = "MIT"
description = "MicroClaw Code (mccode): a terminal coding agent built on the MicroClaw SDK"
publish = false

[[bin]]
name = "mccode"
path = "src/main.rs"

[dependencies]
microclaw-code-core = { version = "0.26.0", path = "../../crates/microclaw-code-core" }
microclaw-sdk = { version = "0.26.0", path = "../../crates/microclaw-sdk", features = ["full"] }
agent-client-protocol-schema = { version = "1.15", default-features = false }
anyhow = "1"
chrono = "0.4"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
pulldown-cmark = { version = "0.12", default-features = false }
reqwest = { version = "0.12", features = ["json"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
similar = "2.7"
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
two-face = { version = "0.4.5", default-features = false, features = ["syntect-fancy"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

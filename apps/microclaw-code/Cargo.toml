[package]
name = "microclaw-code"
version = "0.11.1"
edition = "2024"
license = "MIT"
description = "MicroClaw Code (mccode): a terminal coding agent built on the MicroClaw SDK"
publish = false

[[bin]]
name = "mccode"
path = "src/main.rs"

[dependencies]
microclaw-code-core = { version = "0.11.1", path = "../../crates/microclaw-code-core" }
microclaw-sdk = { version = "0.11.1", path = "../../crates/microclaw-sdk", features = ["full"] }
anyhow = "1"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

[package]
name = "microclaw-code"
version = "0.23.1"
edition = "2024"
license = "MIT"
description = "MicroClaw Code (mccode): a terminal coding agent built on the MicroClaw SDK"
publish = false

[[bin]]
name = "mccode"
path = "src/main.rs"

[dependencies]
microclaw-code-core = { version = "0.23.1", path = "../../crates/microclaw-code-core" }
microclaw-sdk = { version = "0.23.1", path = "../../crates/microclaw-sdk", features = ["full"] }
agent-client-protocol = "0.10.4"
anyhow = "1"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive"] }
crossterm = { version = "0.29", features = ["event-stream"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "rt", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["compat"] }
unicode-width = "0.2"

[dev-dependencies]
tempfile = "3"

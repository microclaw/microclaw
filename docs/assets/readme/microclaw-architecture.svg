<svg width="1400" height="900" viewBox="0 0 1400 900" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">MicroClaw Architecture</title>
  <desc id="desc">MicroClaw Server, Work, and third-party Rust applications share one SDK, Agent Engine, runtime lifecycle, and capability layer.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="900" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset="0.46" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>

    <linearGradient id="panel" x1="120" y1="90" x2="1280" y2="810" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#F0F9FF" stop-opacity="0.92"/>
    </linearGradient>

    <filter id="shadow" x="72" y="48" width="1256" height="804" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.2"/>
    </filter>

    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M1 1L6 4L1 7" stroke="#0F172A" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect width="1400" height="900" rx="30" fill="url(#bg)"/>
  <circle cx="130" cy="110" r="56" fill="#FDE68A" fill-opacity="0.35"/>
  <circle cx="1270" cy="790" r="64" fill="#A7F3D0" fill-opacity="0.3"/>

  <g filter="url(#shadow)">
    <rect x="96" y="72" width="1208" height="760" rx="30" fill="url(#panel)"/>
  </g>

  <text x="140" y="132" fill="#0F172A" font-size="42" font-weight="700" font-family="Segoe UI, Arial, sans-serif">MicroClaw Architecture</text>
  <text x="140" y="168" fill="#475569" font-size="22" font-family="Segoe UI, Arial, sans-serif">One embeddable Rust Agent Engine for Server, native Work, Workers, and third-party apps.</text>

  <rect x="138" y="214" width="252" height="212" rx="24" fill="#DBEAFE"/>
  <text x="166" y="258" fill="#1E3A8A" font-size="29" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Product Apps</text>
  <text x="166" y="294" fill="#1D4ED8" font-size="21" font-family="Segoe UI, Arial, sans-serif">MicroClaw Server</text>
  <text x="166" y="326" fill="#1D4ED8" font-size="21" font-family="Segoe UI, Arial, sans-serif">MicroClaw Work</text>
  <text x="166" y="358" fill="#1D4ED8" font-size="21" font-family="Segoe UI, Arial, sans-serif">third-party Rust apps</text>
  <text x="166" y="390" fill="#1D4ED8" font-size="21" font-family="Segoe UI, Arial, sans-serif">channel adapters</text>

  <rect x="420" y="214" width="330" height="212" rx="24" fill="#DCFCE7"/>
  <text x="450" y="258" fill="#166534" font-size="30" font-weight="700" font-family="Segoe UI, Arial, sans-serif">microclaw-sdk</text>
  <text x="450" y="294" fill="#15803D" font-size="20" font-family="Segoe UI, Arial, sans-serif">stable embedding facade</text>
  <text x="450" y="326" fill="#15803D" font-size="20" font-family="Segoe UI, Arial, sans-serif">AgentProfile + RunRequest</text>
  <text x="450" y="358" fill="#15803D" font-size="20" font-family="Segoe UI, Arial, sans-serif">minimal / standard / full</text>
  <text x="450" y="390" fill="#15803D" font-size="20" font-family="Segoe UI, Arial, sans-serif">events + controls + results</text>

  <rect x="780" y="214" width="244" height="212" rx="24" fill="#FCE7F3"/>
  <text x="812" y="258" fill="#9D174D" font-size="28" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Agent Engine</text>
  <text x="812" y="294" fill="#BE185D" font-size="20" font-family="Segoe UI, Arial, sans-serif">one Agent Loop</text>
  <text x="812" y="326" fill="#BE185D" font-size="20" font-family="Segoe UI, Arial, sans-serif">providers + prompts</text>
  <text x="812" y="358" fill="#BE185D" font-size="20" font-family="Segoe UI, Arial, sans-serif">skills + recovery</text>
  <text x="812" y="390" fill="#BE185D" font-size="20" font-family="Segoe UI, Arial, sans-serif">tools + policy</text>

  <rect x="1052" y="214" width="212" height="212" rx="24" fill="#EDE9FE"/>
  <text x="1080" y="258" fill="#5B21B6" font-size="27" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Runtime</text>
  <text x="1080" y="294" fill="#6D28D9" font-size="20" font-family="Segoe UI, Arial, sans-serif">RunHandle</text>
  <text x="1080" y="326" fill="#6D28D9" font-size="20" font-family="Segoe UI, Arial, sans-serif">cancel + steer</text>
  <text x="1080" y="358" fill="#6D28D9" font-size="20" font-family="Segoe UI, Arial, sans-serif">LocalWorker</text>
  <text x="1080" y="390" fill="#6D28D9" font-size="20" font-family="Segoe UI, Arial, sans-serif">capacity + events</text>

  <path d="M390 320H418" stroke="#0F172A" stroke-width="2.8" marker-end="url(#arrow)"/>
  <path d="M750 320H778" stroke="#0F172A" stroke-width="2.8" marker-end="url(#arrow)"/>
  <path d="M1024 320H1050" stroke="#0F172A" stroke-width="2.8" marker-end="url(#arrow)"/>

  <rect x="214" y="470" width="972" height="132" rx="26" fill="#FEF3C7"/>
  <text x="252" y="516" fill="#92400E" font-size="32" font-weight="700" font-family="Segoe UI, Arial, sans-serif">One Run Lifecycle</text>
  <text x="252" y="550" fill="#A16207" font-size="21" font-family="Segoe UI, Arial, sans-serif">request -> model -> tool_use -> guarded execution -> tool_result -> repeat</text>
  <text x="252" y="582" fill="#A16207" font-size="21" font-family="Segoe UI, Arial, sans-serif">versioned events -> persistence -> terminal RunResult</text>

  <path d="M1146 426V466" stroke="#0F172A" stroke-width="2.8" marker-end="url(#arrow)"/>
  <path d="M588 426V466" stroke="#0F172A" stroke-width="2.8" marker-end="url(#arrow)"/>

  <rect x="138" y="634" width="366" height="166" rx="24" fill="#E0F2FE"/>
  <text x="170" y="678" fill="#0C4A6E" font-size="29" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Core + Storage</text>
  <text x="170" y="714" fill="#075985" font-size="20" font-family="Segoe UI, Arial, sans-serif">stable protocol types</text>
  <text x="170" y="744" fill="#075985" font-size="20" font-family="Segoe UI, Arial, sans-serif">SQLite sessions + memory</text>
  <text x="170" y="774" fill="#075985" font-size="20" font-family="Segoe UI, Arial, sans-serif">checkpoints + recovery</text>

  <rect x="526" y="634" width="366" height="166" rx="24" fill="#ECFCCB"/>
  <text x="558" y="678" fill="#365314" font-size="31" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Capabilities</text>
  <text x="558" y="714" fill="#4D7C0F" font-size="20" font-family="Segoe UI, Arial, sans-serif">tools + sandbox</text>
  <text x="558" y="744" fill="#4D7C0F" font-size="20" font-family="Segoe UI, Arial, sans-serif">Skills + ClawHub + MCP</text>
  <text x="558" y="774" fill="#4D7C0F" font-size="20" font-family="Segoe UI, Arial, sans-serif">hooks + observability</text>

  <rect x="914" y="634" width="350" height="166" rx="24" fill="#F3E8FF"/>
  <text x="946" y="678" fill="#6B21A8" font-size="29" font-weight="700" font-family="Segoe UI, Arial, sans-serif">Agent Workers</text>
  <text x="946" y="714" fill="#7E22CE" font-size="20" font-family="Segoe UI, Arial, sans-serif">Main Agent + Subagents</text>
  <text x="946" y="744" fill="#7E22CE" font-size="20" font-family="Segoe UI, Arial, sans-serif">parent / child Run graph</text>
  <text x="946" y="774" fill="#7E22CE" font-size="20" font-family="Segoe UI, Arial, sans-serif">Worker protocol v1</text>

  <path d="M380 602V632" stroke="#0F172A" stroke-width="2.8" marker-end="url(#arrow)"/>
  <path d="M710 602V632" stroke="#0F172A" stroke-width="2.8" marker-end="url(#arrow)"/>
  <path d="M1088 602V632" stroke="#0F172A" stroke-width="2.8" marker-end="url(#arrow)"/>
</svg>
